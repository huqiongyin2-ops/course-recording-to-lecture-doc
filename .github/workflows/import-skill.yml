jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import validated skill
        run: |
          set -euo pipefail
          printf '%s' "$SKILL_ARCHIVE" | base64 -d > /tmp/skill.zip
          unzip -q /tmp/skill.zip -d /tmp/skill
          cp -a /tmp/skill/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import course recording skill"
          git push
